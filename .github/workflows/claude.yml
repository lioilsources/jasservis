# The vibe loop: write "@claude ..." in an issue or PR comment and Claude
# edits the site on a branch and replies with a link to open a PR.
#
# This repo is PUBLIC, so anyone can open an issue or comment here. Two things
# keep strangers from spending tokens: the author_association check below (the
# job does not even start for them) and claude-code-action's own check that the
# actor has write access. The model, the turn limit and the tool allowlist are
# the cost and blast-radius controls; .github/** is covered by CODEOWNERS.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      # One Claude run per issue/PR at a time, queued rather than cancelled —
      # cancelling mid-push can leave a half-written branch behind.
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # No build step: the site is plain HTML under jasservis.cz/. The only
      # install is Pillow for .github/scripts/firmy-foto.py (photos from the
      # Firmy.cz profile, resized for the site). The turn limit is a cost cap, not
      # a target: 40 ran out on a new menu page (~26 files) and on replacing a
      # long text, because denied commands and progress-comment updates also
      # cost turns. ls and wc are allowed so the model stops tripping on them.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # WebFetch is limited to firmy.cz: the customer asks Claude to sync
          # offers and categories from their Firmy.cz profile. Any other host
          # stays blocked, so a page Claude reads cannot send it elsewhere.
          # Photos go only through firmy-foto.py, which downloads from Seznam's
          # image CDN and writes only into jasservis.cz/wp-content/uploads/.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 100
            --allowedTools "Read,Edit,Write,MultiEdit,Glob,Grep,Bash(git *),Bash(ls *),Bash(wc *),WebFetch(domain:www.firmy.cz),WebFetch(domain:firmy.cz),Bash(.github/scripts/firmy-foto.py *)"
