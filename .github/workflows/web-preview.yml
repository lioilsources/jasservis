# The feedback loop: every PR gets a live URL on Cloudflare Pages, so the
# owner can look at the change on their phone *before* merging.
#
# This is a preview only. Production is GitHub Pages (deploy.yml), which runs
# on push to master — nothing here touches jasservis.cz.
name: Web Preview

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Off until the repo is configured (VIBE_SLUG variable + Cloudflare
    # secrets), so pushes before that don't fail loudly for no reason. PRs from
    # forks are skipped too: they get no secrets and the deploy would only fail.
    if: |
      vars.VIBE_SLUG != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sitemap.sh dates each page by its last commit.
          fetch-depth: 0

      # Same step deploy.yml runs, so a broken sitemap shows up here first.
      # The URLs point at the live domain on purpose — that is what ships.
      - name: Generate sitemap.xml
        run: .github/scripts/sitemap.sh jasservis.cz https://jasservis.cz

      # Every Cloudflare deployment is a preview, including the master one at
      # <slug>-vibe.pages.dev, which Cloudflare itself does not mark noindex.
      # Only the live domain may be indexed, so all of them say so explicitly.
      - name: Keep previews out of search engines
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > jasservis.cz/_headers

      # Same directory deploy.yml publishes — no build beyond the sitemap.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy jasservis.cz --project-name=${{ vars.VIBE_SLUG }}-vibe --branch=${{ github.head_ref || github.ref_name }}

      # Cloudflare gives every deployment its own URL and every branch an alias
      # that always serves the branch's latest deployment. The alias is the link
      # to hand out: it never goes stale, wherever it was pasted.
      - name: Pick the link to share
        id: link
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "url=${ALIAS:-$DEPLOYMENT}" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: web-preview
          message: |
            ### 👀 Podívej se na změnu

            **[Otevřít náhled](${{ steps.link.outputs.url }})**

            Tohle je živá verze téhle změny — klikni z telefonu. Odkaz platí
            pořád a ukazuje vždy poslední verzi. Ostrý web `jasservis.cz` se
            zatím nezměnil. Když se ti náhled líbí, dej **Merge** a za minutu
            dvě je změna na ostrém webu.

            <sub>Právě tato verze: ${{ steps.deploy.outputs.deployment-url }}</sub>

      # The comment ends up far down a long PR, and agents (Codex, Claude) write
      # their own descriptions with links to previews that go stale. One marked
      # block at the top of the description is the place to look, kept current.
      - name: Put the preview link at the top of the PR description
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.link.outputs.url }}
        run: |
          body=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          rest=$(printf '%s' "$body" | perl -0pe 's/<!-- preview-link -->.*?<!-- \/preview-link -->\n*//s')
          block="<!-- preview-link -->
          **[▶ Otevřít aktuální náhled]($URL)** — vždy poslední verze této změny.
          <!-- /preview-link -->"
          printf '%s\n\n%s\n' "$block" "$rest" > "$RUNNER_TEMP/body.md"
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"

      # The owner asked for the change in an issue and is watching that thread,
      # not the PR. Claude's branches are named claude/issue-<N>-..., so the
      # link goes back there too. One comment per issue, updated in place.
      - name: Comment the preview link on the original issue
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/issue-')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PREVIEW_URL: ${{ steps.link.outputs.url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          [[ "$HEAD_REF" =~ ^claude/issue-([0-9]+)- ]] || exit 0
          gh issue comment "${BASH_REMATCH[1]}" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none --body "### 👀 Náhled je připravený

          **[Otevřít náhled]($PREVIEW_URL)**

          Ostrý web se zatím nezměnil. Když se ti náhled líbí, otevři
          [návrh změny]($PR_URL) a dej **Merge**."
