# Preview only. Production remains in deploy.yml.
name: Web Preview
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: |
      vars.VIBE_SLUG != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      url: ${{ steps.link.outputs.url }}
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      head_sha: ${{ steps.provenance.outputs.head_sha }}
      checkout_sha: ${{ steps.provenance.outputs.checkout_sha }}
      tree_sha: ${{ steps.provenance.outputs.tree_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record the source version
        id: provenance
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Build customer-only artifact
        id: validation
        run: .github/scripts/build-public-site.sh jasservis.cz .pages-dist
      - name: Generate sitemap.xml
        run: .github/scripts/sitemap.sh .pages-dist https://jasservis.cz
      - name: Keep previews out of search engines
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > .pages-dist/_headers
      - name: Audit Cloudflare account and Access permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.VIBE_SLUG }}-vibe
        run: |
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          account_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          account_code="$(curl -sS -o account.json -w '%{http_code}' -H "$auth" "$account_api")"
          project_code="$(curl -sS -o project.json -w '%{http_code}' -H "$auth" "$account_api/pages/projects/$PROJECT")"
          access_code="$(curl -sS -o access.json -w '%{http_code}' -H "$auth" "$account_api/access/apps")"
          access_write_probe="$(curl -sS -o access-write.json -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' --data '{}' "$account_api/access/apps")"
          account_name="$(jq -r '.result.name // "unavailable"' account.json 2>/dev/null || true)"
          access_result="denied"
          [[ "$access_code" = 200 ]] && access_result="read"
          {
            echo '## Cloudflare security ownership audit'
            echo "Account name: $account_name"
            echo "Account identifier suffix: …${CLOUDFLARE_ACCOUNT_ID: -6}"
            echo "Account API: $account_code"
            echo "Pages project API: $project_code"
            echo "Access applications API: $access_code ($access_result)"
            echo "Access write probe: $access_write_probe"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare account: $account_name; Pages: $project_code; Access read: $access_code; Access write probe: $access_write_probe"
          test "$project_code" = 200
      - name: Remove the legacy preview project and every old deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.VIBE_SLUG }}-vibe
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          status="$(curl -sS -o delete-project.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          test "$status" = 200
          jq -e '.success == true' delete-project.json >/dev/null
          npx wrangler pages project create "$PROJECT" --production-branch=master
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=${{ vars.VIBE_SLUG }}-vibe --branch=${{ github.head_ref || github.ref_name }}
      - name: Verify customer page and blocked internal paths
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' "$DEPLOYMENT_URL/kontrolky-a-vystrazna-hlaseni/")" = 200
          for path in \
            _warnings/catalog.json \
            _warnings/review-register.json \
            _media/catalog.json \
            kontrolky-a-vystrazna-hlaseni/revize.html \
            kontrolky-a-vystrazna-hlaseni/revize-kapitol.html \
            kontrolky-a-vystrazna-hlaseni/druha-kontrola.html \
            kontrolky-a-vystrazna-hlaseni/zdroje.html \
            kontrolky-a-vystrazna-hlaseni/evidence.json \
            en/kontrolky-a-vystrazna-hlaseni/revize.html \
            en/kontrolky-a-vystrazna-hlaseni/evidence.json \
            de/kontrolky-a-vystrazna-hlaseni/zdroje.html \
            de/kontrolky-a-vystrazna-hlaseni/druha-kontrola.html
          do
            status="$(curl -L -sS -o /dev/null -w '%{http_code}' "$DEPLOYMENT_URL/$path")"
            case "$status" in 403|404) ;; *) echo "Internal URL is public: $path ($status)" >&2; exit 1;; esac
          done
      - name: Pick the link to share
        id: link
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          url="${ALIAS:-$DEPLOYMENT}"
          if [[ "$url" != https://* ]]; then
            echo '::error::Cloudflare did not return a usable preview URL.'
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Publish the deployment result
        if: always()
        env:
          VALIDATION: ${{ steps.validation.outcome }}
          UPLOAD: ${{ steps.deploy.outcome }}
          HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
          CHECKOUT_SHA: ${{ steps.provenance.outputs.checkout_sha }}
          TREE_SHA: ${{ steps.provenance.outputs.tree_sha }}
          PREVIEW_URL: ${{ steps.link.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '## Výsledek náhledu'
            echo "Kontrola katalogu: $VALIDATION"
            echo "Nahrání do Cloudflare: $UPLOAD"
            echo "Zdrojová verze: $HEAD_SHA"
            echo "Skutečný checkout: $CHECKOUT_SHA"
            echo "Git strom: $TREE_SHA"
            echo "Aktuální náhled: $PREVIEW_URL"
            echo "Konkrétní sestavení: $DEPLOYMENT_URL"
            echo 'Oznámení odkazu má samostatnou úlohu.'
          } >> "$GITHUB_STEP_SUMMARY"
  notify:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Share the successful preview without uploading again
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          HEAD_SHA: ${{ needs.deploy.outputs.head_sha }}
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const url = process.env.PREVIEW_URL;
            const deployment = process.env.DEPLOYMENT_URL;
            const sha = process.env.HEAD_SHA;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
            if (pr.head.sha !== sha || pr.state !== 'open') {
              core.notice('Skipped an outdated or closed pull request.');
              return;
            }
            const marker = '<!-- Sticky Pull Request Commentweb-preview -->';
            const tasks = [
              ['Komentář náhledu', async () => {
                const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
                const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
                const body = `${marker}\n### Náhled je připravený\n\n**[Otevřít aktuální náhled](${url})**\n\nPouze testovací náhled. Ostrý web se tímto nasazením nemění.\n\n[Konkrétní sestavení](${deployment}) · verze ${sha}`;
                if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
                else await github.rest.issues.createComment({owner, repo, issue_number, body});
              }],
              ['Popis návrhu změny', async () => {
                const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
                if (current.head.sha !== sha || current.state !== 'open') return;
                const rest = (current.body || '').replace(/<!-- preview-link -->[\s\S]*?<!-- \/preview-link -->\s*/g, '');
                const block = `<!-- preview-link -->\n**[▶ Otevřít aktuální náhled](${url})** — vždy poslední verze této změny.\n\n[Konkrétní sestavení](${deployment}) · verze ${sha}\n<!-- /preview-link -->`;
                await github.rest.pulls.update({owner, repo, pull_number: issue_number, body: `${block}\n\n${rest}`});
              }]
            ];
            const issueMatch = pr.head.ref.match(/^claude\/issue-(\d+)-/);
            if (issueMatch) tasks.push(['Původní zadání', async () => {
              const original = Number(issueMatch[1]);
              const issueMarker = '<!-- web-preview-origin -->';
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: original, per_page: 100});
              const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && (c.body?.includes(issueMarker) || (c.body?.includes(pr.html_url) && c.body?.includes('Náhled je připravený'))));
              const body = `${issueMarker}\n### Náhled je připravený\n\n**[Otevřít náhled](${url})**\n\nPouze testovací náhled. [Návrh změny](${pr.html_url}).`;
              if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
              else await github.rest.issues.createComment({owner, repo, issue_number: original, body});
            }]);
            let failed = false;
            for (const [label, task] of tasks) {
              try { await task(); core.info(`${label}: OK`); }
              catch (error) { failed = true; core.warning(`${label}: ${error.status || 'API error'}. Náhled: ${url}`); }
            }
            await core.summary.addHeading('Předání odkazu').addLink('Aktuální náhled', url).addBreak().addLink('Konkrétní sestavení', deployment).addBreak().addRaw(failed ? 'Některé oznámení selhalo. Úspěšné nahrání náhledu zůstává platné.' : 'Oznámení byla dokončena.').write();
            if (failed) core.setFailed('Některé oznámení odkazu selhalo; nahrání náhledu uspělo.');
