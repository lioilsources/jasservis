# Preview only. Production remains in deploy.yml.
name: Web Preview
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: |
      vars.VIBE_SLUG != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      url: ${{ steps.link.outputs.url }}
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      head_sha: ${{ steps.provenance.outputs.head_sha }}
      checkout_sha: ${{ steps.provenance.outputs.checkout_sha }}
      tree_sha: ${{ steps.provenance.outputs.tree_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record the source version
        id: provenance
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Validate the warning catalogue
        id: validation
        run: |
          python3 jasservis.cz/_warnings/validate.py
          python3 jasservis.cz/_warnings/generate.py --check
          python3 -m unittest discover -s jasservis.cz/_warnings -p test_validate.py
      - name: Generate sitemap.xml
        run: .github/scripts/sitemap.sh jasservis.cz https://jasservis.cz
      - name: Keep previews out of search engines
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > jasservis.cz/_headers
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy jasservis.cz --project-name=${{ vars.VIBE_SLUG }}-vibe --branch=${{ github.head_ref || github.ref_name }}
      - name: Pick the link to share
        id: link
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          url="${ALIAS:-$DEPLOYMENT}"
          if [[ "$url" != https://* ]]; then
            echo '::error::Cloudflare did not return a usable preview URL.'
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Publish the deployment result
        if: always()
        env:
          VALIDATION: ${{ steps.validation.outcome }}
          UPLOAD: ${{ steps.deploy.outcome }}
          HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
          CHECKOUT_SHA: ${{ steps.provenance.outputs.checkout_sha }}
          TREE_SHA: ${{ steps.provenance.outputs.tree_sha }}
          PREVIEW_URL: ${{ steps.link.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '## Výsledek náhledu'
            echo "Kontrola katalogu: $VALIDATION"
            echo "Nahrání do Cloudflare: $UPLOAD"
            echo "Zdrojová verze: $HEAD_SHA"
            echo "Skutečný checkout: $CHECKOUT_SHA"
            echo "Git strom: $TREE_SHA"
            echo "Aktuální náhled: $PREVIEW_URL"
            echo "Konkrétní sestavení: $DEPLOYMENT_URL"
            echo 'Oznámení odkazu má samostatnou úlohu.'
          } >> "$GITHUB_STEP_SUMMARY"
  notify:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Share the successful preview without uploading again
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          HEAD_SHA: ${{ needs.deploy.outputs.head_sha }}
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const url = process.env.PREVIEW_URL;
            const deployment = process.env.DEPLOYMENT_URL;
            const sha = process.env.HEAD_SHA;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
            if (pr.head.sha !== sha || pr.state !== 'open') {
              core.notice('Skipped an outdated or closed pull request.');
              return;
            }
            const marker = '<!-- Sticky Pull Request Commentweb-preview -->';
            const tasks = [
              ['Komentář náhledu', async () => {
                const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
                const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
                const body = `${marker}\n### Náhled je připravený\n\n**[Otevřít aktuální náhled](${url})**\n\nPouze testovací náhled. Ostrý web se tímto nasazením nemění.\n\n[Konkrétní sestavení](${deployment}) · verze ${sha}`;
                if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
                else await github.rest.issues.createComment({owner, repo, issue_number, body});
              }],
              ['Popis návrhu změny', async () => {
                const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
                if (current.head.sha !== sha || current.state !== 'open') return;
                const rest = (current.body || '').replace(/<!-- preview-link -->[\s\S]*?<!-- \/preview-link -->\s*/g, '');
                const block = `<!-- preview-link -->\n**[▶ Otevřít aktuální náhled](${url})** — vždy poslední verze této změny.\n\n[Konkrétní sestavení](${deployment}) · verze ${sha}\n<!-- /preview-link -->`;
                await github.rest.pulls.update({owner, repo, pull_number: issue_number, body: `${block}\n\n${rest}`});
              }]
            ];
            const issueMatch = pr.head.ref.match(/^claude\/issue-(\d+)-/);
            if (issueMatch) tasks.push(['Původní zadání', async () => {
              const original = Number(issueMatch[1]);
              const issueMarker = '<!-- web-preview-origin -->';
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: original, per_page: 100});
              const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && (c.body?.includes(issueMarker) || (c.body?.includes(pr.html_url) && c.body?.includes('Náhled je připravený'))));
              const body = `${issueMarker}\n### Náhled je připravený\n\n**[Otevřít náhled](${url})**\n\nPouze testovací náhled. [Návrh změny](${pr.html_url}).`;
              if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
              else await github.rest.issues.createComment({owner, repo, issue_number: original, body});
            }]);
            let failed = false;
            for (const [label, task] of tasks) {
              try { await task(); core.info(`${label}: OK`); }
              catch (error) { failed = true; core.warning(`${label}: ${error.status || 'API error'}. Náhled: ${url}`); }
            }
            await core.summary.addHeading('Předání odkazu').addLink('Aktuální náhled', url).addBreak().addLink('Konkrétní sestavení', deployment).addBreak().addRaw(failed ? 'Některé oznámení selhalo. Úspěšné nahrání náhledu zůstává platné.' : 'Oznámení byla dokončena.').write();
            if (failed) core.setFailed('Některé oznámení odkazu selhalo; nahrání náhledu uspělo.');
